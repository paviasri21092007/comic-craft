<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Export Successful - ComicCraft
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>

<main class="center-page">


    <section class="success-card">


        <div class="success-icon">

            ✓

        </div>


        <h1>
            Comic Exported!
        </h1>


        <p>
            Your AI-powered comic PDF is ready.
        </p>


        {% if pdf_url %}

        <a
            class="primary-btn inline-btn"
            href="{{ pdf_url }}"
            download
        >
            Download PDF
        </a>

        {% endif %}


        <a
            class="secondary-btn"
            href="/"
        >
            Go Create Another Comic
        </a>


    </section>


</main>

</body>

</html>
